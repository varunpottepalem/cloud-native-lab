fullnameOverride: gateway-service
replicaCount: 1

image:
  repository: registry.localhost:5000/gateway-service
  tag: 0.1.0
  pullPolicy: IfNotPresent

service:
  port: 8000

config:
  SERVICE_NAME: gateway-service
  SERVICE_VERSION: "0.1.0"
  LOG_LEVEL: INFO 
  INVENTORY_SERVICE_URL: http://order-service.app.svc.cluster.local:8002
ingress:
  enabled: true
  className: traefik
  host: gateway.localhost
  path: /