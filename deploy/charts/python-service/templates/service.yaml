{{- $name := default .Release.Name .Values.fullnameOverride }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: app
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  type: ClusterIP