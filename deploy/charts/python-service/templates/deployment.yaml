{{- if not .Values.image.repository }}
{{- fail "You must specify an image repository in values.yaml" }}
{{- end }}
{{- if not .Values.image.tag }}
{{- fail "You must specify an image tag in values.yaml" }}
{{- end }}
{{- $name := default .Release.Name .Values.fullnameOverride }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: app
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initalDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initalDelaySeconds: 2
            periodSeconds: 5
          resources:
{{ toYaml .Values.resources | nindent 12 }}