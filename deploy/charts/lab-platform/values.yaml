namespaces:
  - app
  - data
  - events
  - observability
  - platform

defaultResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

nginx:
  enabled: true
  replicaCount: 2
  image:
    repository: nginx
    tag: 1.27-alpine
  service:
    port: 80
  ingress:
    enabled: true
    className: traefik
    host: lab.localhost