{{- if and .Values.nginx.enabled .Values.nginx.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-test
  namespace: app
spec:
  ingressClassName: {{ .Values.nginx.ingress.className }}
  rules:
    - host: {{ .Values.nginx.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-test
                port:
                  number: 80
{{- end }}